<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>

    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="violetGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1C2333" stroke-width="0.4"/>
    </pattern>

    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#E8F4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="380" height="100" rx="16" fill="url(#bgGrad)"/>
  <rect width="380" height="100" rx="16" fill="url(#grid)" opacity="0.5"/>

  <!-- Icon background: rounded square, vertically centered with margin -->
  <rect x="12" y="12" width="76" height="76" rx="14" fill="#111827" opacity="0.95"/>
  <rect x="12" y="12" width="76" height="76" rx="14" fill="none" stroke="#1C2D40" stroke-width="1"/>

  <!-- ===================== ICON centered in box (box center: 50,50) ===================== -->
  <!-- Original icon spans: x 53-87 (cx=70), y 34-88 (cy=61) -->
  <!-- Translate to center: tx = 50-70 = -20, ty = 50-61 = -9, then scale 0.88 around (50,50) -->
  <g transform="translate(50,50) scale(0.82) translate(-70,-61)">

    <!-- Layer 3 - bottom, violet -->
    <g filter="url(#violetGlow)" opacity="0.5">
      <polygon points="70,88 87,78 87,68 70,78 53,68 53,78"
        fill="none" stroke="#A78BFA" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- Layer 2 - middle, cyan -->
    <g filter="url(#cyanGlow)" opacity="0.72">
      <polygon points="70,73 85,64 85,55 70,64 55,55 55,64"
        fill="none" stroke="#00D4FF" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- Layer 1 - top, cyan bright -->
    <g filter="url(#cyanGlow)">
      <polygon points="70,58 84,50 84,42 70,50 56,42 56,50"
        fill="none" stroke="#00D4FF" stroke-width="2.2" stroke-linejoin="round"/>
    </g>

    <!-- Connectors left -->
    <line x1="56" y1="50" x2="55" y2="64" stroke="#00D4FF" stroke-width="0.9" opacity="0.4"/>
    <line x1="55" y1="64" x2="53" y2="78" stroke="#A78BFA" stroke-width="0.9" opacity="0.35"/>
    <!-- Connectors right -->
    <line x1="84" y1="50" x2="85" y2="64" stroke="#00D4FF" stroke-width="0.9" opacity="0.4"/>
    <line x1="85" y1="64" x2="87" y2="78" stroke="#A78BFA" stroke-width="0.9" opacity="0.35"/>

    <!-- Center apex node -->
    <circle cx="70" cy="34" r="3.8" fill="#00D4FF" opacity="0.95" filter="url(#cyanGlow)"/>
    <circle cx="70" cy="34" r="1.8" fill="#FFFFFF"/>
    <line x1="70" y1="37.8" x2="70" y2="42" stroke="#00D4FF" stroke-width="1.1" opacity="0.5"/>

    <!-- Corner nodes top layer -->
    <circle cx="56" cy="42" r="2" fill="#00D4FF" opacity="0.75"/>
    <circle cx="84" cy="42" r="2" fill="#00D4FF" opacity="0.75"/>
    <!-- Corner nodes mid layer -->
    <circle cx="55" cy="55" r="1.6" fill="#A78BFA" opacity="0.6"/>
    <circle cx="85" cy="55" r="1.6" fill="#A78BFA" opacity="0.6"/>

    <!-- Orbit ellipse -->
    <ellipse cx="70" cy="34" rx="10" ry="4"
      fill="none" stroke="#A78BFA" stroke-width="0.8"
      stroke-dasharray="2.5 2" opacity="0.5"
      transform="rotate(-20, 70, 34)"
    />
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <text
    x="104" y="60"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="32"
    font-weight="700"
    letter-spacing="-1"
  >
    <tspan fill="url(#wordGrad)" filter="url(#textGlow)">tenant</tspan><tspan fill="#00D4FF" filter="url(#cyanGlow)">iq</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="105" y="76"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="7.5"
    fill="#4A5568"
    letter-spacing="2.5"
    font-weight="400"
  >LIFECYCLE MANAGEMENT</text>
</svg>
